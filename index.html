<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Parliament Simulator</title>
  <link rel="stylesheet" href="css/game.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <header class="topbar">
    <h1>Parliament Simulator</h1>
    <div class="controls">
      <span id="userBox" class="user-box">Not signed in</span>
      <button id="btnLogin">Log Masuk</button>
      <button id="btnRegister">Daftar</button>
      <button id="createPartyBtn">Tubuhkan Parti</button>
      <button id="portfolioBtn">Portfolio</button>
      <button id="resetGovBtn">Reset Government & Seats</button>
    </div>
  </header>

  <main class="main">
    <div id="map" class="map"></div>
    <aside id="sidePanel" class="side-panel">
      <section id="dashboard" class="panel-section">
        <h2>Dashboard</h2>
        <div id="dashboardStats">Memuat...</div>
      </section>
      <section id="partyList" class="panel-section">
        <h2>Parti</h2>
        <ul id="parties"></ul>
      </section>
      <section id="regionActions" class="panel-section">
        <h2>Region</h2>
        <div id="regionInfo">Klik pada peta untuk pilih kawasan</div>
      </section>
    </aside>
  </main>

  <!-- Modals (hidden by default) -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <button id="modalClose" class="modal-close">×</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Supabase (no keys here) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/index.min.js"></script>
  <!-- User must create js/config.js based on config.example.js -->
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
